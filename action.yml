name: git-village
description: Render one account's public commits for a profile README.
branding:
  icon: home
  color: green
inputs:
  login:
    description: Account login to draw.
    default: ${{ github.repository_owner }}
  output-dir:
    description: Destination for village.gif, village.png, and preview.html.
    default: village
  setting:
    description: Environment to draw; earth, sky, mars, historic, futuristic, underwater, or underground.
    default: earth
  token:
    description: GitHub token; private commits are always excluded.
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Install the release binary
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        package=$(sed -n 's/^name = "\(.*\)"/\1/p' "$GITHUB_ACTION_PATH/Cargo.toml" | head -1)
        version=$(sed -n 's/^version = "\(.*\)"/\1/p' "$GITHUB_ACTION_PATH/Cargo.toml" | head -1)
        repository=$(sed -n 's/^repository = "\(.*\)"/\1/p' "$GITHUB_ACTION_PATH/Cargo.toml" | head -1)
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) target=x86_64-unknown-linux-musl ;;
          Linux-ARM64) target=aarch64-unknown-linux-musl ;;
          macOS-X64) target=x86_64-apple-darwin ;;
          macOS-ARM64) target=aarch64-apple-darwin ;;
          *) echo "No binary for $RUNNER_OS $RUNNER_ARCH; use cargo install --git" >&2; exit 1 ;;
        esac
        archive="$package-$version-$target.tar.gz"
        install_dir="$RUNNER_TEMP/profile-renderer"
        mkdir -p "$install_dir"
        if ! gh release download "v$version" --repo "$repository" --dir "$install_dir" --pattern "$archive" --pattern "$archive.sha256"; then
          echo "Release binaries are required; use the source-install workflow in examples/profile-workflow.yml" >&2
          exit 1
        fi
        cd "$install_dir"
        if command -v sha256sum >/dev/null; then sha256sum -c "$archive.sha256"; else shasum -a 256 -c "$archive.sha256"; fi
        tar -xzf "$archive"
        echo "$install_dir" >> "$GITHUB_PATH"
        echo "PROFILE_RENDERER=$package" >> "$GITHUB_ENV"
    - name: Collect public commits and render
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PROFILE_LOGIN: ${{ inputs.login }}
        PROFILE_OUTPUT_DIR: ${{ inputs.output-dir }}
        PROFILE_SETTING: ${{ inputs.setting }}
      run: |
        "$PROFILE_RENDERER" collect "$PROFILE_LOGIN" --output "$RUNNER_TEMP/profile-snapshot.json"
        "$PROFILE_RENDERER" render "$RUNNER_TEMP/profile-snapshot.json" --output-dir "$PROFILE_OUTPUT_DIR" --setting "$PROFILE_SETTING"
