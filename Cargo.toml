[package]
name = "git-village"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/raynbowy23/git-village"
description = "Deterministic pixel cities from GitHub commits"
[dependencies]
chrono = { version = "0.4", features = ["serde"] }
gif = "0.14"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[profile.dev]
opt-level = 1
[profile.test]
opt-level = 2
